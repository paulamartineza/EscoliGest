<div class="reminder-form-container">
  <h2>Crear Nuevo Recordatorio</h2>
  <form [formGroup]="reminderForm" (ngSubmit)="onCreateReminder()">
    <label for="nombre">Nombre del Recordatorio</label>
    <input id="nombre" formControlName="nombre" type="text" />

    <label for="tipo">Tipo</label>
    <select id="tipo" formControlName="tipo">
      <option *ngFor="let type of reminderTypes" [value]="type.value">{{ type.label }}</option>
    </select>

    <label for="fecha">Fecha</label>
    <input id="fecha" formControlName="fecha" type="date" />

    <label for="hora">Hora</label>
    <input id="hora" formControlName="hora" type="time" />

    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" formControlName="descripcion"></textarea>

    <button type="submit" [disabled]="reminderForm.invalid">Crear Recordatorio</button>
  </form>
</div>
