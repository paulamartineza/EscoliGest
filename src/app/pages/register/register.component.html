<div class="registration-container">
  <div class="logo" routerLink="/">
    <img src="/assets/images/logo.png" alt="Logo">
  </div>

  <div>
    <h2 style="color: aliceblue; text-align: center;">Crea una cuenta</h2>
    <div style="display: flex; justify-content: space-between;">
      <form class="registration-form" [formGroup]="registrationForm" (ngSubmit)="onRegister()">

        <label for="name">Nombre</label>
        <input type="text" id="name" formControlName="name" placeholder="Ingresa tu nombre">
        <div *ngIf="registrationForm.get('name')?.invalid && registrationForm.get('name')?.touched">
          <small class="error-text">El nombre es obligatorio.</small>
        </div>

        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="Ingresa tu correo">
        <div *ngIf="registrationForm.get('email')?.invalid && registrationForm.get('email')?.touched">
          <small class="error-text">El correo es obligatorio y debe ser válido.</small>
        </div>

        <label for="phone">Teléfono</label>
        <input type="tel" id="phone" formControlName="phone" placeholder="Ingresa tu número de teléfono">
        <div *ngIf="registrationForm.get('phone')?.invalid && registrationForm.get('phone')?.touched">
          <small class="error-text">El teléfono es obligatorio.</small>
        </div>



        <label for="role">Usted es:</label>
        <select id="role" formControlName="role">
          <option value="" disabled>Seleccione una opción</option>
          <option value="paciente">Paciente</option>
          <option value="medico">Médico</option>
        </select>
        <div *ngIf="registrationForm.get('role')?.invalid && registrationForm.get('role')?.touched">
          <small class="error-text">El rol es obligatorio.</small>
        </div>

        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="Ingresa tu contraseña">
        <div *ngIf="registrationForm.get('password')?.invalid && registrationForm.get('password')?.touched">
          <small class="error-text">La contraseña es obligatoria y debe tener al menos 6 caracteres.</small>
        </div>

        <label for="confirm-password">Confirmar Contraseña</label>
        <input type="password" id="confirm-password" formControlName="confirmPassword"
          placeholder="Confirma tu contraseña">
        <div
          *ngIf="registrationForm.get('confirmPassword')?.invalid && registrationForm.get('confirmPassword')?.touched">
          <small class="error-text">Por favor confirma tu contraseña.</small>
        </div>

        <div class="button-container">
          <button class="cssbuttons-io-button" class="cssbuttons-io-button" type="submit">
            Registrar
            <div class="icon">
              <svg height="24" width="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 0h24v24H0z" fill="none"></path>
                <path d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"
                  fill="currentColor"></path>
              </svg>
            </div>
          </button>

          <p style="color: aliceblue;">Ya estoy registrado <a routerLink="/login" style="color: aliceblue;">Iniciar
              sesión</a></p>
            </div>
            </form>
 
  </div>
