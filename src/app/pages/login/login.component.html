
<div  class="registration-container">
    <div class="logo">
        <a routerLink="/home">
          <img src="/assets/images/logo.png" alt="Logo">
        </a>
      </div>
      <form class="form" (ngSubmit)="onLogin()">
        <p class="form-title">Inicio de sesión</p>
        <div class="input-container">
            <label for="email">Correo</label>
          <input type="email" for="email" placeholder="Ingresar email" />
          <span></span>
        </div>
        <div class="input-container">
            <label for="password">Contraseña</label>
          <input type="password" placeholder="Ingresar contraseña" />
        </div>
        <button class="cssbuttons-io-button"type="submit" routerLink="/inicio" > 
            Iniciar sesión
             <div class="icon">
               <svg
                 height="24"
                 width="24"
                 viewBox="0 0 24 24"
                 xmlns="http://www.w3.org/2000/svg"
               >
                 <path d="M0 0h24v24H0z" fill="none"></path>
                 <path
                   d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"
                   fill="currentColor"
                 ></path>
               </svg>
             </div>
           </button>
        <p class="signup-link">
          ¿No estás registrado?
          <a routerLink="/register">Registrarse</a>
        </p>
      </form>
      

</div>
