<div class="profile-container">
    <h2>Perfil del Usuario</h2>
    
    <div class="profile-field">
      <label for="name">Nombre:</label>
      <input type="text" id="name" [(ngModel)]="user.name" placeholder="Nombre del usuario" />
    </div>
  
    <div class="profile-field">
      <label for="email">Correo:</label>
      <input type="email" id="email" [(ngModel)]="user.email" placeholder="Correo del usuario" />
    </div>
  
    <div class="profile-field">
      <label for="phone">Teléfono:</label>
      <input type="tel" id="phone" [(ngModel)]="user.phone" placeholder="Teléfono del usuario" />
    </div>
  
    <div class="profile-field">
      <label for="role">Rol:</label>
      <select id="role" [(ngModel)]="user.role">
        <option value="paciente">Paciente</option>
        <option value="médico">Médico</option>
      </select>
    </div>
  
    <div class="profile-field">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" [(ngModel)]="user.password" placeholder="Contraseña" />
    </div>
  
    <div class="profile-buttons">
      <button (click)="goToHome()">Volver a Inicio</button>
      <button (click)="saveChanges()">Guardar Cambios</button>
    </div>
  </div>
